<!--
Lecture 2 - Images, URLs and links

What I practiced:
- Using img with src, width, height and alt.
- Showing a local image from the imgs folder and an online image.
- Using a to open local pages and an external website.
- Using target="_blank" to open a link in a new tab.
-->
<!-- The p tag displays a short paragraph. -->
<p>My Home Page</p>
<!-- This first image is loaded from an online URL. -->
<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR0ZvWPz8ipI2JS_gzLVGArDXvtubtQENsS6HwegPfYxGQC6EMRtg4H9GsI&s=10" alt="Home banner" />
<!-- This image is saved in my project. alt describes the image. -->
<img src="./imgs/me.webp" width="200" height="200" alt="Odegaard" />

<!-- A domain is the name of a website. A host stores the website files. -->

<!-- Local links: href points to another HTML file in this folder. -->
<a href="index.html">Home Page</a>
<a href="login.html">sign in</a>
<a href="register.html">sign up</a>
<a href="about.html">about</a>
<a href="contact.html">contact</a>

<!-- An external link. target="_blank" opens a new tab. -->
<a href="https://www.youtube.com/watch?v=tlKhLHEaJgs&list=RDtlKhLHEaJgs&start_radio=1" target="_blank">Youtube</a>
