<!DOCTYPE html>
<!--
Lecture 5 - The name attribute in forms

What I practiced:
- The name attribute gives a form value a key when submitted.
- Radio buttons with the same name are one group.
- Checkboxes can share a name and still allow multiple selections.
- Using value for form options, select, option and submit.
-->
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- The name attribute is important when form data is submitted. -->
    <form>
        <div>
            <label>your name</label>
            <input type="text" name="name" />
        </div>

        <div>
            <label>your password</label>
            <input type="password" name="pass" />
        </div>

        <div>
            <label>your age</label>
            <input type="number" />
        </div>
        <div>
            <!-- Radio buttons with the same name let us choose only one option. -->
            <label>gender </label>
            <input type="radio" name="gender" value="1">
            <label>male</label>
            <input type="radio" name="gender" value="2">
            <label>female</label>

        </div>
        <div>
            <!-- Unlike radio, checkboxes let us choose more than one option. -->
            <label>languages </label>
            <input type="checkbox" name="lang" value="python">
            <label>python</label>
            <input type="checkbox" name="lang" value="js">
            <label>js</label>

        </div>

        <div>
            <!-- select is a dropdown; each option has a value. -->
            <label>role</label>
            <select name ="role">
                <option value="user">user</option>
                <option value="admin">admin</option>
                <option value="s_admin">superadmin</option>
            </select>
        </div>
        <!-- This submit input sends the form when connected to a destination. -->
        <input type="submit" />
    </form>
</body>

</html>
