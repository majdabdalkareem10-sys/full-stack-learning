<!DOCTYPE html>
<!--
Lecture 3 - HTML page structure and iframes

What I practiced:
- Using DOCTYPE, html, head, title and body.
- Using h1 and p to show text.
- Embedding a YouTube video with iframe.
- Showing another local HTML file inside an iframe.
- Embedding a Google Map with iframe.
-->
<html lang="en">
<head>
    <!-- These meta tags set the text encoding and screen width. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- The title is shown in the browser tab. -->
    <title>Document page</title>
</head>
<body>
    <!-- h1 is the main heading of this page. -->
    <h1>Mark Zuckerberg</h1>
    <p> motivational speaker   </p>
    <!-- iframe can display another page, such as a YouTube video. -->
    <iframe width="560" height="315" src="https://www.youtube.com/embed/VEetaDgnfJM?si=YrAbpIJyQAPDj2aj" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        <p> page   </p>
        <!-- A local iframe can show policy.html inside this page. -->
        <iframe width="560" height="315" src="policy.html"> </iframe>
                    <p> map ramallah</p>

        <!-- This iframe embeds a Google Map. It needs internet access. -->
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d54191.51729199396!2d35.247081926084995!3d31.907417067652915!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1502d54cda2d58d1%3A0xbf6d4d17cc8b2c76!2z2LHYp9mFINin2YTZhNmH!5e0!3m2!1sar!2s!4v1793755602098!5m2!1sar!2s" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
</body>
</html>
